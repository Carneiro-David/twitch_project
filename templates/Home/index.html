<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.25/css/jquery.dataTables.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.10.25/js/jquery.dataTables.js"></script>
    
    <title>Graphique</title>
</head>

<body>
    <h1 class="text-center mb-4 mt-4">Stat sur le jeu</h1>
    <div class="container">
        <div class="d-flex flex-wrap">
            <div id="chart-by-year" class="col-12 col-lg-6">
                {% if chart_image_by_year %}
                <img src="data:image/png;base64,{{ chart_image_by_year }}" alt="Graphique à barres par année">
                {% endif %}
            </div>

            <div id="graphAnne" class="col-12 col-lg-6">
                <form method="post" id="year-form">
                    <label for="year-select">Sélectionnez une année :</label>
                    <select id="year-select" name="year">
                        <option value="">{{annee}}</option>
                        {% for year in years %}
                        {% if year != annee %}
                        <option value="{{ year }}">{{ year }}</option>
                        {% endif %}
                        {% endfor %}
                    </select>
                </form>
                {% if graphAnne %}
                <img src="data:image/png;base64,{{ graphAnne }}" alt="Graphique à barres par mois">
                {% endif %}
            </div>
        </div>
        <div>
            <h1>Peak viewer all time : {{test}}</h1>
            <div>
                <table id="example" class="table table-striped" style="width:100%">
                    <thead>
                        <tr>
                            <th>Jeu</th>
                            <th>Record de viewers</th>
                            <th>Office</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in table %}
                        <tr>
                            <td>{{ item['game'] }}</td>
                            <td>{{ item['peak_viewer'] }}</td>
                            <td>{{ item['year'] }}</td>
                        </tr>
                        {% endfor %}

                    </tbody>
                </table>
                {{table}}
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var yearSelect = document.getElementById('year-select');
            var yearForm = document.getElementById('year-form');

            yearSelect.addEventListener('change', function () {
                yearForm.submit();
            });
        });
        new DataTable('#example');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script>
        $(document).ready(function () {
            $('#example').DataTable();
        });
    </script>
</body>

</html>
