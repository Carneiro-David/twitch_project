{% extends 'base.html' %}
{% block title %}Timeline{% endblock %}
{% block content %}
<div id='chart' class='chart'></div>

<script src='https://cdn.plot.ly/plotly-latest.min.js'></script>
<script type='text/javascript'>
    var graphs = {{fig | safe}};
    Plotly.plot('chart',graphs,{});
</script>
{% endblock %}
